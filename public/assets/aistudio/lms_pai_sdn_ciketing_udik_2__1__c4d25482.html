function uuidv4() { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) { var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8); return v.toString(16); }); }
function toCamel(obj) { if (Array.isArray(obj)) return obj.map(v => toCamel(v)); if (obj !== null && typeof obj === 'object') { return Object.keys(obj).reduce((acc, key) => { acc[key.replace(/_([a-z])/g, g => g[1].toUpperCase())] = toCamel(obj[key]); return acc; }, {}); } return obj; }
function toSnake(obj) { if (Array.isArray(obj)) return obj.map(v => toSnake(v)); if (obj !== null && typeof obj === 'object') { return Object.keys(obj).reduce((acc, key) => { acc[key.replace(/[A-Z]/g, l => `_${l.toLowerCase()}`)] = toSnake(obj[key]); return acc; }, {}); } return obj; }

function formatHariTanggalIndo(dateStr) {
  if (!dateStr) return '-';
  try {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, (m || 1) - 1, d || 1);
    return dt.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  } catch (e) { return dateStr; }
}

async function supaFetch(path, method = 'GET', body = null) {
  const url = `${SUPA_URL}/rest/v1/${path}`, headers = { 'apikey': SUPA_ANON_KEY, 'Authorization': `Bearer ${SUPA_ANON_KEY}`, 'Content-Type': 'application/json' };
  if(method === 'POST' || method === 'PATCH') headers['Prefer'] = 'return=minimal';
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : null });
  if(!res.ok) throw new Error(`HTTP Error ${res.status}`);
  if(method === 'GET') return await res.json();
  return true;
}

async function generateStudentUsername(classId) {
  try {
    const c = await supaFetch(`classes?id=eq.${classId}`);
    if (!c || c.length === 0) return "S" + Math.floor(Math.random()*1000); 
    const classNameClean = c[0].class_name.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    const studentsInClass = await supaFetch(`users?role=eq.siswa&class_id=eq.${classId}&select=username`);
    let urutanTinggi = 0;
    if (studentsInClass && studentsInClass.length > 0) {
      studentsInClass.forEach(s => {
        const uname = s.username;
        if(uname.startsWith(classNameClean)) {
          const numStr = uname.substring(classNameClean.length);
          if(!isNaN(numStr)) { const num = parseInt(numStr, 10); if(num > urutanTinggi) urutanTinggi = num; }
        }
      });
    }
    const urutanBaru = urutanTinggi + 1;
    return classNameClean + String(urutanBaru).padStart(2, '0'); 
  } catch (e) { return "S" + Math.floor(Math.random()*10000); }
}

const DirectAPI = {

    try {
      const cleanUsername = username.replace(/\s+/g, '').toUpperCase();

      if(!users || users.length === 0) return {success: false, message: 'Username atau Password salah!'};
      
      const u = toCamel(users[0]);
      let className = '';
      if(u.classId) {
        const c = await supaFetch(`classes?id=eq.${u.classId}`);
        if(c && c.length) className = c[0].class_name;
      }
      return {success: true, data: { userId: u.id, role: u.role, fullName: u.fullName, username: u.username, classId: u.classId || '', className }};

  uploadStudentsBulk: async (studentsArray) => {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const payload = [];
    const classCounters = {}; 
    const classesData = await supaFetch('classes');
    const existingUsers = await supaFetch('users?role=eq.siswa&select=class_id,username');
    
    for (let i=0; i<classesData.length; i++) {
        const cid = classesData[i].id;
        const cNameClean = classesData[i].class_name.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        let urutanTinggi = 0;
        existingUsers.forEach(eu => {
            if(eu.class_id === cid && eu.username.startsWith(cNameClean)) {
                const numStr = eu.username.substring(cNameClean.length);
                if(!isNaN(numStr)) {
                    const num = parseInt(numStr, 10);
                    if(num > urutanTinggi) urutanTinggi = num;
                }
            }
        });
        classCounters[cid] = { prefix: cNameClean, counter: urutanTinggi };
    }

    for (let i = 0; i < studentsArray.length; i++) {
      const s = studentsArray[i];
      let pwd = ''; 
      for (let j = 0; j < 6; j++) pwd += chars.charAt(Math.floor(Math.random() * chars.length));
      
      let finalUsername = "S" + Math.floor(Math.random()*100000); 
      if (classCounters[s.classId]) {
          classCounters[s.classId].counter += 1;
          const numPadded = String(classCounters[s.classId].counter).padStart(2, '0');
          finalUsername = classCounters[s.classId].prefix + numPadded;
      }
      payload.push(toSnake({ id: uuidv4(), role: 'siswa', username: finalUsername, password: pwd, fullName: s.fullName, nis: s.nis || '-', classId: s.classId, avatarColor: '#10b981' }));
    }
    
    if(payload.length > 0) await supaFetch('users', 'POST', payload);
    return { success: true };
  },

  submitQuiz: async (quizId, studentId, answersJson, status) => {
    const questions = toCamel(await supaFetch(`questions?quiz_id=eq.${quizId}`));
    const answers = typeof answersJson === 'string' ? JSON.parse(answersJson) : answersJson;
    let score = 0, maxScore = 0;
    
    questions.forEach(q => {
      maxScore += q.scoreWeight;
      const ans = answers[q.id];
      if (ans === undefined || ans === null || ans === '') return;
      if (q.questionType === 'pg_standar' || q.questionType === 'benar_salah') {
        if (String(ans).trim() === String(q.correctAnswer).trim()) score += q.scoreWeight;
      } else if (q.questionType === 'pg_kompleks') {
        const studentAns = String(ans).split(',').sort().join(',');
        const correctAns = String(q.correctAnswer).split(',').sort().join(',');
        if (studentAns === correctAns) score += q.scoreWeight;
      }
    });
    
    const percentage = maxScore > 0 ? Math.round((score / maxScore) * 100) : 0;
    const attemptId = uuidv4();
    await supaFetch('quizattempts', 'POST', toSnake({ id: attemptId, quizId, studentId, answersJson: JSON.stringify(answers), score, startedAt: new Date().toISOString(), submittedAt: new Date().toISOString(), status }));
    await supaFetch('scores', 'POST', toSnake({ id: uuidv4(), studentId, quizId, attemptId, rawScore: score, maxScore, percentage, graded: !questions.some(q=>q.questionType==='essay') }));
    return { success: true, data: { score, maxScore, percentage } };
  },

  getClassRecap: async (classId, semester) => {
    const students = toCamel(await supaFetch(`users?role=eq.siswa&class_id=eq.${classId}`));
    let allQuizzes = toCamel(await supaFetch(`quizzes?select=id,title,created_at,class_id,semester`));
    
    let filteredQuizzes = allQuizzes.filter(q => (!q.classId || q.classId === classId) && (!semester || q.semester === semester));
    filteredQuizzes.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));

    const scores = toCamel(await supaFetch('scores?select=*'));
    const cls = toCamel(await supaFetch(`classes?id=eq.${classId}`));
    
    const recapped = students.map(s => {
      const sScores = scores.filter(x => x.studentId === s.id);
      const quizScores = {};
      let validScores = [];
      
      filteredQuizzes.forEach(q => {
        const match = sScores.find(x => x.quizId === q.id);
        if (match) {
          quizScores[q.id] = match.percentage;
          validScores.push(match.percentage);
        } else {
          quizScores[q.id] = null;
        }
      });
      
      const avg = validScores.length ? Math.round(validScores.reduce((a,b)=>a+b,0)/validScores.length) : 0;
      return { id: s.id, name: s.fullName, avg, quizCount: validScores.length, quizScores };
    });
    
    const allAvgs = recapped.filter(r => r.quizCount > 0).map(r => r.avg);
    const stats = { 
      avgClass: allAvgs.length ? Math.round(allAvgs.reduce((a,b)=>a+b,0)/allAvgs.length) : 0, 
      highest: allAvgs.length ? Math.max(...allAvgs) : 0, 
      lowest: allAvgs.length ? Math.min(...allAvgs) : 0 
    };
    
    return { success: true, data: { className: cls.length ? cls[0].className : '', students: recapped, quizzes: filteredQuizzes, stats } };
  },

async function serverCall(fnName, args = []) {
  try {
    if (DirectAPI[fnName]) {
      return await DirectAPI[fnName](...args);
    }
    if (typeof google !== 'undefined' && google.script) {
      return await new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fnName](...args);
      });
    }
    return { success: false, message: 'Fungsi server tidak ditemukan: ' + fnName };
  } catch (e) {
    showToast('Gagal memproses data: ' + e.message, 'error');
    return { success: false, message: e.message || String(e) };
  }
}

function showLoadingContent(msg = "Memuat data...") {
  document.getElementById('mainContent').innerHTML = `
    <div class="flex flex-col items-center justify-center h-64 opacity-70">
      <div class="spinner mb-4 w-10 h-10 border-4"></div>
      <p class="text-sm text-slate-400 font-medium animate-pulse">${msg}</p>
    </div>
  `;
}

function setLoadingButton(btnId, isLoad, text = "Tunggu...") {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  if (isLoad) {
    btn.disabled = true;
    btn.dataset.original = btn.innerHTML;
    btn.innerHTML = `<div class="spinner w-4 h-4 border-2 mr-2"></div> ${text}`;
    btn.classList.add('opacity-70', 'cursor-not-allowed');
  } else {
    btn.disabled = false;
    btn.innerHTML = btn.dataset.original || btn.innerHTML;
    btn.classList.remove('opacity-70', 'cursor-not-allowed');
  }
}

function showToast(msg, type='success') {
  const c = document.getElementById('toastContainer');
  const colors = { success:'border-emerald-500 bg-emerald-500/90', error:'border-red-500 bg-red-500/90', info:'border-blue-500 bg-blue-500/90' };
  const icons = { success:'check-circle', error:'alert-circle', info:'info' };
  const el = document.createElement('div');
  el.className = `toast backdrop-blur-md border-l-4 ${colors[type]} rounded-xl p-4 flex items-center gap-3 min-w-[280px] sm:min-w-[320px] shadow-2xl text-white pointer-events-auto`;
  el.innerHTML = `<i data-lucide="${icons[type]}" class="w-5 h-5"></i><p class="text-sm font-medium flex-1">${msg}</p>`;
  c.appendChild(el);
  try { lucide.createIcons(); } catch(e){}
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.3s ease';
    setTimeout(() => el.remove(), 300);
  }, 3500);
}

async function handleLogin() {
  try {
    const user = document.getElementById('loginUsername').value.trim();
    const pass = document.getElementById('loginPassword').value.trim();
    
    if (!user || !pass) {
      showToast('Harap isi username & password', 'error');
      return;
    }
    
    if(user.toLowerCase() === 'admin' && pass === 'admin123') {
      APP.session = { userId: 'admin-bypass', role: 'admin', fullName: 'Guru PAI', username: 'admin', classId: '', className: '' };
      localStorage.setItem('lmsSession', JSON.stringify(APP.session));
      showMainApp();
      showToast('Berhasil masuk ke mode Guru PAI', 'success');
      return;
    }
    
    setLoadingButton('btnLogin', true, 'Memeriksa...');
    const res = await serverCall('loginUser', [user, pass]);
    setLoadingButton('btnLogin', false);
    
    if (res.success) {
      APP.session = res.data;
      localStorage.setItem('lmsSession', JSON.stringify(res.data));
      showMainApp();
      showToast('Berhasil masuk', 'success');
    } else {
      showToast(res.message || 'Login gagal, pastikan nama/username benar', 'error');
    }
  } catch(err) {
    setLoadingButton('btnLogin', false);
    showToast('Terjadi kesalahan sistem: ' + err.message, 'error');
  }
}

async function navigate(viewId) {

  document.querySelectorAll('[data-nav]').forEach(el => el.classList.remove('active', 'bg-white/10', 'text-emerald-400'));
  const activeLink = document.querySelector(`[data-nav="${viewId}"]`);
  if (activeLink) activeLink.classList.add('active', 'bg-white/5', 'text-emerald-400');
  
  if (APP.session.role === 'admin') {
    switch(viewId) {
      case 'dashboard': return renderAdminDashboard();
      case 'profile': return renderProfile();
      case 'settings': return renderSettings();
      case 'classes': return renderClasses();
      case 'students': return renderStudents();
      case 'attendance': return renderAttendance();
      case 'journals': return renderTeachingJournals();
      case 'questions': return renderQuestions();
      case 'quizzes': return renderQuizzes();
      case 'materials': return renderMaterials();
      case 'references': return renderReferences();
      case 'announcements': return renderAnnouncements();
      case 'reports': return renderReports();

  } else {
    switch(viewId) {
      case 'dashboard': return renderStudentDashboard();
      case 'student-quizzes': return renderStudentQuizzes();
      case 'student-materials': return renderStudentMaterials();
      case 'student-references': return renderStudentReferences();

    }
  }
}

async function saveSettings() {
  const principalName = val('set_principalName');
  const principalNip = val('set_principalNip');
  if (!principalName) return showToast('Nama Kepala Sekolah wajib diisi!', 'error');

  let appLogoUrl = APP.appSettings?.appLogoUrl || '';
  const fileInput = document.getElementById('set_logoFileInput');
  if (fileInput && fileInput.files[0]) {
    appLogoUrl = await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(fileInput.files[0]);
    });
  }

  setLoadingButton('btnSaveSettings', true, 'Menyimpan...');
  const settingsData = { principalName, principalNip, appLogoUrl };
  const res = await serverCall('saveAppSettings', [settingsData]);
  setLoadingButton('btnSaveSettings', false);

  if (res.success) {
    APP.appSettings = settingsData;
    if (appLogoUrl) {
      const loginLogo = document.getElementById('loginLogoImg');
      const sidebarLogo = document.getElementById('sidebarLogoImg');
      if (loginLogo) loginLogo.src = appLogoUrl;
      if (sidebarLogo) sidebarLogo.src = appLogoUrl;
    }
    showToast('Pengaturan berhasil disimpan!', 'success');
  } else {
    showToast(res.message || 'Gagal menyimpan pengaturan', 'error');
  }
}

function renderStudentsTable() {
  const search = val('searchStudent').toLowerCase(), classFilter = val('filterStudentClass');
  let filtered = APP.data.students.filter(s => (s.fullName.toLowerCase().includes(search) || (s.nis||'').toLowerCase().includes(search)) && (!classFilter || s.classId === classFilter));
  filtered.sort((a,b) => a.fullName.localeCompare(b.fullName));
  
  document.getElementById('studentsTableBody').innerHTML = filtered.length === 0 ? '<tr><td colspan="7" class="text-center py-10 text-slate-500 italic">Tidak ada siswa</td></tr>' :
    filtered.map((s, index) => `
      <tr class="hover:bg-white/5">
        <td class="py-3 px-4 text-center font-mono text-slate-500 text-xs">${index + 1}</td>
        <td class="py-3 px-4 font-mono text-slate-400 text-xs">${s.nis === '-' ? 'Kosong' : s.nis}</td>
        <td class="py-3 px-4 font-bold text-slate-200">${s.fullName}</td>
        <td class="py-3 px-4"><span class="badge bg-white/10 text-emerald-300 border border-emerald-500/30">${s.className||'-'}</span></td>
        <td class="py-3 px-4 text-cyan-300 text-sm font-bold tracking-widest">${s.username}</td>
        <td class="py-3 px-4 text-amber-400 text-sm font-mono tracking-widest font-bold">${s.password}</td>

function openStudentModal(id=null) {

  openModal(id ? 'Edit Siswa' : 'Siswa Baru', `
    <div class="space-y-4">
      <div><label class="text-xs font-bold text-slate-400 mb-1.5 block">Nama Lengkap <span class="text-red-400">*</span></label><input id="f_fullName" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10" value="${s?.fullName||''}" placeholder="Nama Sesuai Akta"></div>

}

async function saveStudent(id='') {
  const data = { nis: val('f_nis'), fullName: val('f_fullName'), classId: val('f_classId') };
  if (!data.fullName || !data.classId) return showToast('Nama & Kelas wajib', 'error');
  setLoadingButton('btnSaveStudent', true);
  const res = await serverCall(id ? 'updateStudent' : 'createStudent', id ? [id, data.nis, data.fullName, data.classId] : [data.nis, data.fullName, data.classId]);
  setLoadingButton('btnSaveStudent', false);
  if (res.success) { showToast('Disimpan'); closeModal(); renderStudents(); } else showToast(res.message, 'error');
}

window.handleImportExcel = async function(e) {
  const file = e.target.files[0]; if(!file) return;
  const classId = val('filterStudentClass');
  if(!classId) { e.target.value = ''; return showToast('PILIH KELAS DULU di filter atas!', 'error'); }
  showToast('Membaca Excel...', 'info'); const reader = new FileReader();
  reader.onload = async function(evt) {
    try {
      const workbook = XLSX.read(new Uint8Array(evt.target.result), {type: 'array'});
      const excelRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
      const studentsToInsert = excelRows.map(row => {
        const keys = Object.keys(row);
        const nameKey = keys.find(k => k.toLowerCase().includes('nama'));
        const nisKey = keys.find(k => k.toLowerCase().includes('nis'));
        return nameKey ? { fullName: String(row[nameKey]).trim(), nis: nisKey ? String(row[nisKey]).trim() : '', classId } : null;
      }).filter(s => s !== null);
      if(studentsToInsert.length === 0) return showToast('Harus ada judul kolom "Nama".', 'error');
      
      showToast('Membuat Username urut...', 'info');
      const res = await serverCall('uploadStudentsBulk', [studentsToInsert]);
      if(res.success) { showToast(`Selesai tambah ${studentsToInsert.length} siswa!`); renderStudents(); } else showToast(res.message, 'error');
    } catch(err) { showToast('Gagal: ' + err.message, 'error'); }
    document.getElementById('importExcelInput').value = '';
  };
  reader.readAsArrayBuffer(file);
};

function deleteStudent(id) {
  askConfirm('Hapus data siswa ini?', async () => {
    const res = await serverCall('deleteStudent', [id]);
    if (res.success) renderStudents();
  });
}

window.switchAttTab = function(tab) {
  document.getElementById('viewAttDaily').classList.toggle('hidden', tab !== 'daily');
  document.getElementById('viewAttMonthly').classList.toggle('hidden', tab !== 'monthly');
  const act = "px-4 py-2 border-b-2 border-emerald-400 text-emerald-400 font-bold text-sm";
  const inact = "px-4 py-2 border-b-2 border-transparent text-slate-400 hover:text-slate-300 font-semibold text-sm";
  document.getElementById('tabAttDaily').className = tab === 'daily' ? act : inact;
  document.getElementById('tabAttMonthly').className = tab === 'monthly' ? act : inact;
};

window.getStatusColor = function(status) { return status === 'Sakit' ? 'bg-blue-500/10 border-blue-500/30 text-blue-400' : (status === 'Izin' ? 'bg-amber-500/10 border-amber-500/30 text-amber-400' : (status === 'Alpa' ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400')); };
window.updateStatusColor = function(sel) { sel.className = `att-status w-full px-3 py-2 rounded-lg text-xs font-bold border ${getStatusColor(sel.value)} outline-none cursor-pointer`; };

window.saveDaily = async function() {
  const c = val('attClass'), d = val('attDate');
  const payload = Array.from(document.querySelectorAll('.att-row')).map(r => ({ studentId: r.dataset.sid, status: r.querySelector('.att-status').value, notes: r.querySelector('.att-notes').value }));
  setLoadingButton('btnSaveAtt', true); 
  const res = await serverCall('saveDailyAttendance', [c, d, JSON.stringify(payload)]); 
  setLoadingButton('btnSaveAtt', false);
  if(res.success) showToast('Absensi tersimpan'); else showToast(res.message, 'error');
};

window.renderJournalsTable = function() {
  const tbody = document.getElementById('journalsTableBody');
  if (!tbody) return;
  const fDate = val('journalFilterDate');
  const fClass = val('journalFilterClass');
  const fStatus = val('journalFilterStatus');

  let list = (APP.data.journals || []).filter(j => {
    return (!fDate || j.date === fDate) && (!fClass || j.classId === fClass) && (!fStatus || j.status === fStatus);
  });

  list.sort((a, b) => new Date(b.date) - new Date(a.date));

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9" class="text-center py-10 text-slate-400 italic">Belum ada catatan jurnal pada filter tanggal/kelas ini. Klik <b>"+ Isi Jurnal Mengajar"</b> untuk menambahkan.</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map((j, idx) => {
    const absentBadges = Array.isArray(j.absentStudents) && j.absentStudents.length > 0
      ? j.absentStudents.map(s => `<span class="inline-block bg-rose-500/15 text-rose-300 border border-rose-500/30 rounded px-2 py-0.5 text-[10px] mr-1 mb-1">${s}</span>`).join('')
      : `<span class="text-emerald-400 text-xs font-semibold">NIHIL (Hadir Semua)</span>`;

    const isTuntas = j.status === 'Tuntas';
    return `
      <tr class="hover:bg-white/5 align-top">
        <td class="py-3 px-3 text-center font-mono text-slate-400">${idx + 1}</td>
        <td class="py-3 px-3 font-semibold text-amber-300 text-xs">${formatHariTanggalIndo(j.date)}</td>
        <td class="py-3 px-3"><span class="badge bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">${j.className || '-'}</span></td>
        <td class="py-3 px-4 font-bold text-white">${j.topic || '-'}</td>
        <td class="py-3 px-4 text-slate-300 text-xs leading-relaxed whitespace-pre-line">${j.learningObjective || '-'}</td>
        <td class="py-3 px-4 text-slate-300 text-xs leading-relaxed whitespace-pre-line">${j.reflection || '-'}</td>
        <td class="py-3 px-3">${absentBadges}</td>
        <td class="py-3 px-3 text-center">
          <span class="badge ${isTuntas ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'}">${j.status || 'Tuntas'}</span>
        </td>
        <td class="py-3 px-3 text-right whitespace-nowrap">
          <button onclick="openJournalModal('${j.id}')" class="p-2 rounded-lg bg-blue-500/20 text-blue-400 hover:bg-blue-500/40 mr-1"><i data-lucide="pencil" class="w-4 h-4"></i></button>
          <button onclick="deleteJournalEntry('${j.id}')" class="p-2 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/40"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </td>
      </tr>
    `;
  }).join('');
  try { lucide.createIcons(); } catch(e){}
};

window.populateJournalStudentDropdown = function() {
  const cid = val('f_jClass');
  const sel = document.getElementById('f_jStudentSelect');
  if (!sel) return;
  const students = (APP.data.students || []).filter(s => s.classId === cid).sort((a,b) => a.fullName.localeCompare(b.fullName));
  if (students.length === 0) {
    sel.innerHTML = `<option value="">-- Belum ada siswa di kelas ini --</option>`;
  } else {
    sel.innerHTML = `<option value="">-- Pilih Nama Siswa --</option>` + students.map(s => `<option value="${s.fullName}">${s.fullName}</option>`).join('');
  }
};

window.addAbsentStudentToJournal = function() {
  const name = val('f_jStudentSelect');
  const reason = val('f_jAbsentReason') || 'Sakit';
  if (!name) return showToast('Pilih nama siswa terlebih dahulu', 'info');
  const entry = `${name} (${reason})`;
  if (!APP._tempJournalAbsent.includes(entry)) {
    APP._tempJournalAbsent.push(entry);
  }
  renderTempJournalAbsentChips();
};

window.removeAbsentStudentFromJournal = function(idx) {
  APP._tempJournalAbsent.splice(idx, 1);
  renderTempJournalAbsentChips();
};

window.renderTempJournalAbsentChips = function() {
  const box = document.getElementById('f_jAbsentListContainer');
  if (!box) return;
  if (!APP._tempJournalAbsent || APP._tempJournalAbsent.length === 0) {
    box.innerHTML = `<span class="text-xs text-emerald-400 italic">Nihil — Semua siswa hadir.</span>`;
    return;
  }
  box.innerHTML = APP._tempJournalAbsent.map((item, idx) => `
    <span class="inline-flex items-center gap-1.5 bg-rose-500/20 text-rose-200 border border-rose-500/30 px-2.5 py-1 rounded-lg text-xs font-semibold">
      ${item}
      <button type="button" onclick="removeAbsentStudentFromJournal(${idx})" class="text-rose-400 hover:text-white font-bold">&times;</button>
    </span>
  `).join('');
};

window.syncAbsentFromDailyAttendance = async function() {
  const cid = val('f_jClass');
  const dateStr = val('f_jDate');
  if (!cid || !dateStr) return showToast('Pilih kelas dan tanggal terlebih dahulu', 'error');
  const res = await serverCall('getDailyAttendance', [cid, dateStr]);
  if (res.success && Array.isArray(res.data)) {
    const absents = res.data.filter(s => s.status && s.status !== 'Hadir').map(s => `${s.fullName} (${s.status})`);
    APP._tempJournalAbsent = absents;
    renderTempJournalAbsentChips();
    showToast(absents.length ? `Ditemukan ${absents.length} siswa tidak hadir` : 'Semua siswa tercatat Hadir pada tanggal ini', 'info');
  }
};

window.generateJournalFieldAI = function(mode) {
  const topic = val('f_jTopic') || 'Pendidikan Agama Islam dan Budi Pekerti';
  const cid = val('f_jClass');
  const status = val('f_jStatus') || 'Tuntas';
  const clsObj = (APP.data.classes || []).find(c => c.id === cid);
  const className = clsObj ? clsObj.className : 'SD';

  if (mode === 'objective') {
    const objectives = [
      `Melalui kegiatan diskusi, tanya jawab, dan pengamatan kisah teladan pada materi "${topic}", peserta didik kelas ${className} mampu memahami makna pokok materi dengan benar, menunjukkan sikap santun serta tanggung jawab, dan mempraktikkan nilai-nilai "${topic}" dalam kehidupan sehari-hari di rumah maupun di sekolah.`,
      `Setelah mengikuti pembelajaran berbasis pengalaman kontekstual tentang "${topic}", peserta didik kelas ${className} diharapkan mampu menjelaskan konsep dasar materi secara runtut serta membiasakan perilaku mulia sesuai ajaran Islam dalam pergaulan sehari-hari.`
    ];
    document.getElementById('f_jObjective').value = objectives[Math.floor(Math.random() * objectives.length)];
    showToast('Tujuan Pembelajaran berhasil dirumuskan oleh AI ✨', 'success');
  } else {
    const reflectionText = status === 'Tuntas'
      ? `Pembelajaran materi "${topic}" di kelas ${className} berjalan dengan sangat baik, interaktif, dan menyenangkan. Sebagian besar peserta didik antusias berdiskusi serta mampu mengaitkan materi dengan pengalaman keseharian mereka. Tindak lanjut: memberikan pengayaan dan pembiasaan amal shalih di rumah.`
      : `Sebagian peserta didik kelas ${className} sudah memahami materi "${topic}", namun masih terdapat beberapa siswa yang memerlukan bimbingan lebih lanjut dalam memahami penerapan materi secara mendalam. Tindak lanjut: melaksanakan pendampingan remedial dan latihan terbimbing pada pertemuan berikutnya.`;
    document.getElementById('f_jReflection').value = reflectionText;
    showToast('Refleksi Pembelajaran berhasil dirumuskan oleh AI ✨', 'success');
  }
};

window.saveJournalEntry = async function(id = '') {
  const date = val('f_jDate');
  const classId = val('f_jClass');
  const status = val('f_jStatus') || 'Tuntas';
  const topic = val('f_jTopic');
  const learningObjective = val('f_jObjective');
  const reflection = val('f_jReflection');

  if (!date || !classId || !topic || !learningObjective) {
    return showToast('Harap lengkapi Tanggal, Kelas, Materi, dan Tujuan Pembelajaran!', 'error');
  }

  const clsObj = (APP.data.classes || []).find(c => c.id === classId);
  const entry = {
    id: id || uuidv4(),
    date,
    classId,
    className: clsObj ? clsObj.className : '',
    topic,
    learningObjective,
    reflection,
    absentStudents: APP._tempJournalAbsent || [],
    status,
    teacherName: APP.teacherProfile.fullName,
    schoolName: APP.teacherProfile.schoolName
  };

  setLoadingButton('btnSaveJournal', true, 'Menyimpan...');
  let list = Array.isArray(APP.data.journals) ? [...APP.data.journals] : [];
  const idx = list.findIndex(x => x.id === id);
  if (idx >= 0) list[idx] = entry;
  else list.unshift(entry);

  APP.data.journals = list;
  await serverCall('saveTeachingJournals', [list]);
  setLoadingButton('btnSaveJournal', false);
  closeModal();
  renderJournalsTable();
  showToast('Jurnal Mengajar berhasil disimpan!', 'success');
};

window.deleteJournalEntry = function(id) {
  askConfirm('Hapus catatan jurnal mengajar ini?', async () => {
    APP.data.journals = (APP.data.journals || []).filter(x => x.id !== id);
    await serverCall('saveTeachingJournals', [APP.data.journals]);
    renderJournalsTable();
    showToast('Jurnal dihapus', 'info');
  });
};
