    let hasPulledStandaloneCloud = false;

    function getStorage(key, defaultValue) {
      try {
        const isFresh = localStorage.getItem(STORAGE_KEYS.FRESH_EMPTY_FLAG) === 'true';
        const raw = localStorage.getItem(key);
        if (!raw) {
          if (isFresh) {
            if (Array.isArray(defaultValue)) return [];
            if (key === STORAGE_KEYS.PROFILE) return { fullName: '', nip: '', jabatan: '', schoolName: '', subject: '' };
          }
          if (!hasPulledStandaloneCloud) {
            return defaultValue;
          }
          localStorage.setItem(key, JSON.stringify(defaultValue));
          return defaultValue;
        }
        return JSON.parse(raw);
      } catch {
        return defaultValue;
      }
    }

    function setStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        fetch('/api/cloud-store/upsert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify([{ key, payload: value, updated_at: new Date().toISOString() }])
        }).catch(() => {});
      } catch (e) {
        console.error('Storage error:', e);
      }
    }

    async function pullStandaloneFromCloud() {
      try {
        const res = await fetch('/api/cloud-store');
        if (!res.ok) return false;
        const json = await res.json();
        const rows = Array.isArray(json.rows) ? json.rows : [];
        let changed = false;
        rows.forEach(row => {
          if (row && row.key && row.payload !== undefined) {
            if (row.key === STORAGE_KEYS.FRESH_EMPTY_FLAG) {
              if (row.payload === true || row.payload === 'true') {
                localStorage.setItem(STORAGE_KEYS.FRESH_EMPTY_FLAG, 'true');
              } else {
                localStorage.removeItem(STORAGE_KEYS.FRESH_EMPTY_FLAG);
              }
              return;
            }
            const nextStr = JSON.stringify(row.payload);
            if (localStorage.getItem(row.key) !== nextStr) {
              localStorage.setItem(row.key, nextStr);
              changed = true;
            }
          }
        });
        hasPulledStandaloneCloud = true;
        return changed;
      } catch {
        hasPulledStandaloneCloud = true;
        return false;
      }
    }

            id: period.id,
            createdAt: period.createdAt || (existing ? existing.createdAt : new Date().toISOString())
          };
          const idx = list.findIndex(p => p.id === period.id);
          if (idx !== -1) list[idx] = updated;
          else list.unshift(updated);
        } else {
          updated = {
            ...period,
            id: 'ekp-' + Math.random().toString(36).substring(2, 9),

        const filtered = periodId ? list.filter(a => a.periodId === periodId) : [...list];

          const dateCmp = a.date.localeCompare(b.date);
          if (dateCmp !== 0) return dateCmp;
          return a.createdAt.localeCompare(b.createdAt);
        });

          else list.push(updated);
        } else {
          updated = {
            ...activity,
            id: 'eka-' + Math.random().toString(36).substring(2, 9),
            createdAt: new Date().toISOString()
          };
          list.push(updated);
        }
        setStorage(STORAGE_KEYS.E_KINERJA_ACTIVITIES, list);
        return updated;
      },

        const list = getStorage(STORAGE_KEYS.E_KINERJA_ACTIVITIES, INITIAL_E_KINERJA_ACTIVITIES);

            id: act.id || 'eka-' + Math.random().toString(36).substring(2, 9) + '-' + idx,
            createdAt: act.createdAt || new Date(Date.now() + idx * 100).toISOString()

      const handleUploadSignatureTtd = (files) => {
        if (!files || files.length === 0) return;
        const file = files[0];
        if (!file.type.startsWith('image/')) {
          showToast('Pilih file gambar (PNG / JPG / WEBP) untuk Tanda Tangan (TTD)!', 'error');
          return;
        }
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 520;
            const MAX_HEIGHT = 240;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) {
              height = Math.round((height * MAX_WIDTH) / width);
              width = MAX_WIDTH;
            }
            if (height > MAX_HEIGHT) {
              width = Math.round((width * MAX_HEIGHT) / height);
              height = MAX_HEIGHT;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            if (!ctx) {
              const rawUrl = String(e.target?.result || '');
              persistNotaDinasConfig({ ...notaDinasForm, signatureDataUrl: rawUrl }, false);
              showToast('Gambar TTD berhasil diunggah!', 'success');
              return;
            }
            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            const pngDataUrl = canvas.toDataURL('image/png');
            persistNotaDinasConfig({ ...notaDinasForm, signatureDataUrl: pngDataUrl }, false);
            showToast('Gambar Tanda Tangan (TTD) berhasil diunggah & disimpan otomatis!', 'success');
          };
          img.src = String(e.target?.result || '');
        };
        reader.readAsDataURL(file);

      const compressImageFile = (file) => {

          const reader = new FileReader();

            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_DIMENSION = 720;
              let width = img.width;
              let height = img.height;

              if (width > height) {
                if (width > MAX_DIMENSION) {
                  height = Math.round((height * MAX_DIMENSION) / width);
                  width = MAX_DIMENSION;
                }
              } else {
                if (height > MAX_DIMENSION) {
                  width = Math.round((width * MAX_DIMENSION) / height);
                  height = MAX_DIMENSION;
                }
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              if (!ctx) {
                const rawUrl = e.target?.result;
                resolve({
                  dataUrl: rawUrl,
                  originalSizeKb,
                  compressedSizeKb: originalSizeKb,
                  savedPercent: 0
                });
                return;
              }

              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, width, height);
              ctx.drawImage(img, 0, 0, width, height);

              const qualities = [0.66, 0.54, 0.44, 0.35];
              let compressedDataUrl = canvas.toDataURL('image/jpeg', qualities[0]);
              let compressedSizeKb = Math.max(1, Math.round((compressedDataUrl.length * 3) / 4 / 1024));

              for (let i = 1; i < qualities.length; i++) {
                if (compressedSizeKb <= 60) break;
                compressedDataUrl = canvas.toDataURL('image/jpeg', qualities[i]);
                compressedSizeKb = Math.max(1, Math.round((compressedDataUrl.length * 3) / 4 / 1024));
              }

              if (compressedSizeKb > 75) {
                const smallCanvas = document.createElement('canvas');
                smallCanvas.width = Math.round(width * 0.75);
                smallCanvas.height = Math.round(height * 0.75);
                const sCtx = smallCanvas.getContext('2d');
                if (sCtx) {
                  sCtx.fillStyle = '#ffffff';
                  sCtx.fillRect(0, 0, smallCanvas.width, smallCanvas.height);
                  sCtx.drawImage(canvas, 0, 0, smallCanvas.width, smallCanvas.height);
                  compressedDataUrl = smallCanvas.toDataURL('image/jpeg', 0.5);
                  compressedSizeKb = Math.max(1, Math.round((compressedDataUrl.length * 3) / 4 / 1024));
                }
              }

              const savedPercent =
                originalSizeKb > compressedSizeKb
                  ? Math.min(99, Math.round(((originalSizeKb - compressedSizeKb) / originalSizeKb) * 100))
                  : 0;

              resolve({
                dataUrl: compressedDataUrl,
                originalSizeKb,
                compressedSizeKb,
                savedPercent
              });
            };
            img.onerror = err => reject(err);
            img.src = e.target?.result;
          };
          reader.onerror = err => reject(err);
          reader.readAsDataURL(file);
        });
      };

      /**
       * Membaca berkas dokumen (PDF / Word: .pdf, .doc, .docx)
       */
      const readDocumentFile = (file, indexOffset = 0) => {
        const fileSizeKb = Math.max(1, Math.round(file.size / 1024));
        const lowerName = file.name.toLowerCase();
        const isPdf = lowerName.endsWith('.pdf') || file.type === 'application/pdf';
        const isWord =
          lowerName.endsWith('.doc') ||
          lowerName.endsWith('.docx') ||
          file.type.includes('word') ||
          file.type.includes('officedocument.wordprocessingml');

        const fileType = isPdf ? 'pdf' : isWord ? 'word' : 'other';

        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => {
            const dataUrl = String(e.target?.result || '');
            resolve({
              id: 'doc-ek-' + Math.random().toString(36).substring(2, 9) + '-' + indexOffset,
              fileName: file.name,
              fileType,
              mimeType:
                file.type ||
                (isPdf
                  ? 'application/pdf'
                  : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'),
              fileSizeKb,
              dataUrl,
              uploadedAt: new Date().toISOString()
            });
          };
          reader.onerror = err => reject(err);
          reader.readAsDataURL(file);
        });

            entry.rencanaAksiId === '__custom__' || !selectedRaObj
              ? entry.customRencanaAksi.trim()
              : selectedRaObj.title;

          if (!finalRaText) {
            showToast(
              `Pilih atau ketik Jenis Kegiatan (Rencana Aksi) pada baris kegiatan ke-${i + 1}!`,
              'error'
            );
            return;
          }

          const combinedTlList = [...entry.selectedTindakLanjut];
          if (entry.customTindakLanjut.trim()) {
            combinedTlList.push(entry.customTindakLanjut.trim());
          }

          if (combinedTlList.length === 0) {
            showToast(
              `Pilih atau ketik minimal 1 Tindak Lanjut pada kegiatan ke-${i + 1}!`,
              'error'
            );
            return;
          }

          const linkedRkhId = entry.rkhId || selectedRaObj?.rkhId || targetPeriod.rkhList[0]?.id;
          const linkedRkhObj = targetPeriod.rkhList.find(r => r.id === linkedRkhId);

          const finalOutputText =
            entry.outputText.trim() ||
            buildSmartLocalOutput({
              rkhText: linkedRkhObj?.title || '',
              rencanaAksiText: finalRaText,
              tindakLanjutText: combinedTlList.join(' • ')
            }).primaryOutput;

          preparedPayloads.push({
            id: editingActivity ? editingActivity.id : undefined,
            periodId: targetPeriod.id,
            date: formDate,
            rkhId: linkedRkhId,
            rkhText: linkedRkhObj?.title || '',
            rencanaAksiId: selectedRaObj?.id,
            rencanaAksiText: finalRaText,
            tindakLanjutText: combinedTlList.join(' • '),
            tindakLanjutList: combinedTlList,
            outputText: finalOutputText,
            photos: entry.photos,
            documents: entry.documents,
            createdAt: editingActivity ? editingActivity.createdAt : undefined
          });
        }

        if (editingActivity && preparedPayloads.length === 1) {
          StorageService.saveEKinerjaActivity(preparedPayloads[0]);
          showToast('Kegiatan E-Kinerja Harian berhasil diperbarui!', 'success');

                .map(r => `<li style="margin-bottom:3px;">${r.title}</li>`)

            : '-';

          });

        let docCounterInTable = 1;

          periodActivities.length > 0
            ? periodActivities
                .map((act, idx) => {

                            .join('')}
                        </div>`
                      : '';

                      ? `${photosHtml}${docsInCellHtml}`

            </div>
          )}

          {/* MODAL KONFIRMASI HAPUS KEGIATAN */}
          {deleteActivityConfirmId && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-strong rounded-3xl max-w-sm w-full p-6 border border-white/15 text-center space-y-4">
                <h4 className="font-bold text-base text-white">Hapus Kegiatan Harian?</h4>
                <p className="text-xs text-slate-400">
                  Data kegiatan beserta foto dokumentasi dan dokumen bukti fisik pada baris ini akan dihapus dari tabel E-Kinerja.
                </p>
                <div className="flex justify-center gap-2.5">
                  <button
                    onClick={() => setDeleteActivityConfirmId(null)}
                    className="px-4 py-2 rounded-xl bg-white/10 text-slate-300 text-xs font-bold cursor-pointer"
                  >
                    Batal
                  </button>
                  <button
                    onClick={confirmDeleteActivity}
                    className="px-5 py-2 rounded-xl bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold cursor-pointer"
                  >
                    Ya, Hapus
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<EKinerjaApp />);
  </script>
</body>
</html>
