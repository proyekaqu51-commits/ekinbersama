<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with rounded rectangle for maskable safe-zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" />

  <!-- Shield / Emblem Container -->
  <g filter="url(#shadow)" transform="translate(256, 256) scale(0.85) translate(-256, -256)">
    <!-- Clipboard / Document Base -->
    <rect x="120" y="100" width="272" height="340" rx="36" fill="#1e293b" stroke="#334155" stroke-width="6"/>
    
    <!-- Header Clip -->
    <rect x="186" y="80" width="140" height="44" rx="16" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="256" cy="102" r="10" fill="#713f12" />

    <!-- Performance Document Rows -->
    <rect x="160" y="160" width="192" height="18" rx="9" fill="#475569" />
    <rect x="160" y="196" width="140" height="14" rx="7" fill="#334155" />
    
    <!-- Central E-Kinerja & WFA Emblem -->
    <circle cx="256" cy="290" r="76" fill="#042f2e" stroke="url(#emeraldGrad)" stroke-width="6"/>
    
    <!-- Checkmark Badge & Globe for WFA -->
    <path d="M224 290 L246 312 L292 266" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Small Globe / Compass / Star Accent -->
    <circle cx="256" cy="290" r="54" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4 4"/>
    <ellipse cx="256" cy="290" rx="28" ry="54" fill="none" stroke="#059669" stroke-width="2"/>
    <line x1="202" y1="290" x2="310" y2="290" stroke="#059669" stroke-width="2"/>

    <!-- Bottom Badge Indicator -->
    <rect x="164" y="386" width="184" height="28" rx="14" fill="#065f46" />
    <text x="256" y="405" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle" letter-spacing="2">E-KINERJA • WFA</text>
  </g>
</svg>
